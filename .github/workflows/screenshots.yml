name: Screenshots and Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        working-directory: rust
        run: cargo test

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test tooling
        run: python -m pip install --upgrade pip pytest

      - name: Validate Python sources
        run: python -m py_compile python/*.py

  screenshots:
    name: Generate Screenshots
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Puppeteer
        run: npm install --no-save puppeteer

      - name: Generate all JavaScript screenshots
        shell: bash
        run: |
          mkdir -p docs/screenshots
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { pathToFileURL } = require('url');
          const puppeteer = require('puppeteer');

          const pinpads = [
            { file: 'thermal-pinpad.html', output: 'thermal-pinpad-js.png', buttonId: 'randomCodeBtn' },
            { file: 'sevastolink-pinpad.html', output: 'sevastolink-pinpad-js.png', buttonId: 'randomBtn' },
            { file: 'mr-robot-pinpad.html', output: 'mr-robot-pinpad-js.png', buttonId: 'randomBtn' },
          ];

          (async () => {
            const root = process.cwd();
            const browser = await puppeteer.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox'],
            });

            try {
              for (const pinpad of pinpads) {
                const htmlPath = path.join(root, 'javascript', pinpad.file);
                const outputPath = path.join(root, 'docs', 'screenshots', pinpad.output);

                if (!fs.existsSync(htmlPath)) {
                  console.log(`Skipping ${pinpad.file} - file not found`);
                  continue;
                }

                console.log(`Capturing ${pinpad.file}...`);

                const page = await browser.newPage();
                await page.setViewport({ width: 400, height: 500, deviceScaleFactor: 1 });
                await page.goto(pathToFileURL(htmlPath).href, { waitUntil: 'load' });
                await new Promise((resolve) => setTimeout(resolve, 1000));

                const button = await page.$(`#${pinpad.buttonId}`);
                if (button) {
                  await button.click();
                  await new Promise((resolve) => setTimeout(resolve, 500));
                }

                await page.screenshot({ path: outputPath });
                console.log(`Saved: ${outputPath}`);
                await page.close();
              }
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python screenshot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip pygame

      - name: Generate Python screenshot
        shell: bash
        run: |
          mkdir -p docs/screenshots
          xvfb-run -a python - <<'PY'
          import os
          import sys
          import time

          repo_root = os.getcwd()
          python_root = os.path.join(repo_root, "python")
          output_path = os.path.join(repo_root, "docs", "screenshots", "thermal-pinpad-py.png")

          if not os.path.isfile(os.path.join(python_root, "thermal_pinpad.py")):
              print("thermal_pinpad.py missing; skipping Python screenshot.")
              raise SystemExit(0)

          sys.path.insert(0, python_root)

          import pygame
          from thermal_pinpad import (
              ThermalColorMapper,
              ThermalConfig,
              ThermalKeypad,
              ThermalPalette,
              calculate_ring_intensity,
          )

          pygame.init()
          width, height = 400, 500
          screen = pygame.display.set_mode((width, height))
          pygame.display.set_caption("Thermal Pinpad")

          bg_dark = (5, 5, 8)
          bg_panel = (10, 10, 20)
          border_color = (26, 42, 58)
          text_dim = (58, 74, 90)
          text_bright = (106, 138, 154)
          accent_cyan = (0, 170, 255)

          button_width, button_height = 80, 60
          button_gap = 10
          margin_x, margin_y = 40, 85
          labels = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "*", "0", "#"]

          config = ThermalConfig()
          keypad = ThermalKeypad(config)
          mapper = ThermalColorMapper()
          palette = ThermalPalette.SPLINTER_CELL

          start_ms = time.time() * 1000
          for index, digit in enumerate("4829"):
              keypad.press_button_at(digit, start_ms + index * 200)
          now_ms = start_ms + 900
          intensities = keypad.get_all_intensities(now_ms)

          try:
              font_small = pygame.font.SysFont("consolas", 14)
              font_button = pygame.font.SysFont("consolas", 28, bold=True)
          except Exception:
              font_small = pygame.font.Font(None, 14)
              font_button = pygame.font.Font(None, 28)

          screen.fill(bg_dark)
          panel_rect = pygame.Rect(20, 45, 360, 425)
          pygame.draw.rect(screen, bg_panel, panel_rect, border_radius=10)
          pygame.draw.rect(screen, border_color, panel_rect, width=1, border_radius=10)

          for index, label in enumerate(labels):
              row, col = index // 3, index % 3
              x = margin_x + col * (button_width + button_gap)
              y = margin_y + row * (button_height + button_gap)
              intensity = intensities[label]

              if intensity >= config.min_visible_intensity:
                  glow = pygame.Surface((width, height), pygame.SRCALPHA)
                  for ring in range(config.num_rings - 1, -1, -1):
                      ri = calculate_ring_intensity(intensity, ring, config.num_rings)
                      if ri < config.min_visible_intensity:
                          continue
                      color = mapper.intensity_to_rgb(ri, palette)
                      alpha = min(255, int(ri * 120))
                      radius = int(max(button_width, button_height) * 0.45 * ((ring + 1) / config.num_rings))
                      pygame.draw.circle(glow, (*color, alpha), (x + button_width // 2, y + button_height // 2), radius)
                  screen.blit(glow, (0, 0))

              fill = mapper.intensity_to_rgb(intensity * 0.3, palette) if intensity >= config.min_visible_intensity else (15, 20, 30)
              label_color = mapper.intensity_to_rgb(intensity, palette) if intensity >= config.min_visible_intensity else (80, 100, 120)
              
              rect = pygame.Rect(x, y, button_width, button_height)
              pygame.draw.rect(screen, fill, rect, border_radius=6)
              pygame.draw.rect(screen, border_color, rect, width=1, border_radius=6)
              
              text = font_button.render(label, True, label_color)
              text_rect = text.get_rect(center=rect.center)
              screen.blit(text, text_rect)

          pygame.image.save(screen, output_path)
          pygame.quit()
          PY

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Build Rust simulator
        working-directory: rust
        run: cargo build --features simulator --bin simulator

      - name: Generate Rust screenshot
        run: |
          mkdir -p docs/screenshots
          timeout 10s rust/target/debug/simulator --screenshot docs/screenshots/thermal-pinpad-rust.png || echo "Screenshot generated"

      - name: List screenshots
        run: ls -la docs/screenshots/

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/
          if-no-files-found: warn

  commit-screenshots:
    name: Commit Screenshots
    runs-on: ubuntu-latest
    needs:
      - test-suite
      - screenshots
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots

      - name: Commit updated screenshots
        shell: bash
        run: |
          mkdir -p docs/screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
            exit 0
          fi
          git commit -m "[skip ci] Update generated screenshots"
          git pull --rebase origin main
          git push
