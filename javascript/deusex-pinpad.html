<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deus Ex: Human Revolution Keypad</title>
    <style>
        :root {
            --background: #131200;
            --primary-gold: #FFEA21;
            --amber: #E5AF2E;
            --dark-gold: #B49125;
            --cyan: #00FFFF;
            --red: #FF0000;
            --panel-bg: #090900;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            color: var(--primary-gold);
            font-family: "Consolas", "Monaco", monospace;
            background:
                radial-gradient(circle at 15% 10%, rgba(255, 234, 33, 0.08), transparent 35%),
                radial-gradient(circle at 85% 90%, rgba(229, 175, 46, 0.06), transparent 40%),
                linear-gradient(180deg, #060600, var(--background) 45%, #070700);
        }

        .frame {
            width: min(96vw, 420px);
            background: linear-gradient(180deg, rgba(19, 18, 0, 0.95), rgba(9, 9, 0, 0.97));
            border: 1px solid rgba(229, 175, 46, 0.58);
            border-radius: 14px;
            padding: 20px 18px;
            box-shadow:
                0 0 32px rgba(255, 234, 33, 0.18),
                inset 0 0 24px rgba(255, 234, 33, 0.08);
            position: relative;
            overflow: hidden;
        }

        .frame::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.045) 0px,
                rgba(255, 255, 255, 0.045) 1px,
                transparent 1px,
                transparent 3px
            );
            mix-blend-mode: screen;
            opacity: 0.22;
            animation: scan 2.8s linear infinite;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 11px;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: var(--dark-gold);
            margin-bottom: 10px;
        }

        .hud .accent {
            color: var(--cyan);
            text-shadow: 0 0 7px rgba(0, 255, 255, 0.4);
        }

        .display {
            border: 1px solid rgba(229, 175, 46, 0.7);
            border-radius: 9px;
            min-height: 84px;
            padding: 12px 14px;
            margin-bottom: 16px;
            background:
                linear-gradient(180deg, rgba(255, 234, 33, 0.1), rgba(255, 234, 33, 0.02)),
                rgba(8, 8, 0, 0.82);
            box-shadow:
                0 0 17px rgba(255, 234, 33, 0.3),
                inset 0 0 16px rgba(255, 234, 33, 0.11);
        }

        .status {
            font-size: 11px;
            letter-spacing: 1.7px;
            text-transform: uppercase;
            color: var(--dark-gold);
            margin-bottom: 8px;
        }

        .code {
            font-size: 29px;
            line-height: 1;
            letter-spacing: 8px;
            color: #fff8d2;
            text-shadow:
                0 0 12px rgba(255, 234, 33, 0.95),
                0 0 4px rgba(255, 255, 255, 0.95);
            min-height: 30px;
        }

        .hint {
            margin-top: 8px;
            font-size: 11px;
            color: var(--amber);
            letter-spacing: 1px;
        }

        .keys {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }

        .key {
            border: 1.5px solid rgba(229, 175, 46, 0.78);
            border-radius: 11px;
            height: 68px;
            background: linear-gradient(180deg, rgba(255, 234, 33, 0.06), rgba(19, 18, 0, 0.9));
            color: #fff6bf;
            font-size: 29px;
            font-weight: 700;
            text-shadow:
                0 0 9px rgba(255, 234, 33, 0.9),
                0 0 2px rgba(255, 255, 255, 0.9);
            cursor: pointer;
            position: relative;
            transition: transform 90ms ease, border-color 90ms ease;
            box-shadow:
                0 0 16px rgba(229, 175, 46, 0.28),
                inset 0 0 11px rgba(255, 234, 33, 0.1);
        }

        .key::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 9px;
            border: 1px solid rgba(255, 255, 255, 0.17);
            pointer-events: none;
        }

        .key:focus-visible {
            outline: 2px solid var(--primary-gold);
            outline-offset: 2px;
        }

        .key:hover {
            border-color: var(--primary-gold);
            box-shadow:
                0 0 24px rgba(255, 234, 33, 0.46),
                inset 0 0 15px rgba(255, 234, 33, 0.2);
        }

        .key:active {
            transform: translateY(1px) scale(0.99);
        }

        .key.flash {
            animation: keyflash 100ms ease-out;
        }

        .frame.booting .display,
        .frame.booting .keys {
            animation: boot-glitch 400ms steps(5, end);
        }

        .status.ok {
            color: #9cff9c;
        }

        .status.error {
            color: var(--red);
            text-shadow: 0 0 7px rgba(255, 0, 0, 0.5);
        }

        @keyframes scan {
            from { transform: translateY(-4px); }
            to { transform: translateY(4px); }
        }

        @keyframes keyflash {
            0% {
                border-color: #ffffff;
                box-shadow:
                    0 0 30px rgba(255, 255, 255, 0.82),
                    0 0 40px rgba(255, 234, 33, 0.95),
                    inset 0 0 18px rgba(255, 255, 255, 0.85);
                background: linear-gradient(180deg, rgba(255, 255, 255, 0.5), rgba(255, 234, 33, 0.18));
            }
            100% {
                border-color: rgba(229, 175, 46, 0.78);
            }
        }

        @keyframes boot-glitch {
            0% {
                filter: contrast(1.7) brightness(1.3) saturate(1.5);
                transform: translateX(-3px);
                opacity: 0.35;
            }
            40% {
                filter: contrast(1.9) brightness(0.8);
                transform: translateX(3px);
                opacity: 0.7;
            }
            70% {
                filter: contrast(1.4) brightness(1.1);
                transform: translateX(-2px);
                opacity: 0.9;
            }
            100% {
                filter: none;
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 480px) {
            .frame { padding: 16px 14px; }
            .key { height: 62px; font-size: 25px; }
            .code { font-size: 25px; letter-spacing: 6px; }
        }
    </style>
</head>
<body>
    <main class="frame booting" id="frame" aria-label="Deus Ex keypad">
        <div class="hud">
            <span>Sarif Security Panel</span>
            <span class="accent">I/O Port</span>
        </div>
        <section class="display" aria-live="polite">
            <div class="status" id="statusText">Boot sequence...</div>
            <div class="code" id="maskedCode"></div>
            <div class="hint">Keys: 0-9, C/Backspace clear, E/Enter submit</div>
        </section>

        <div class="keys" id="keys"></div>
    </main>

    <script>
        (() => {
            "use strict";

            const COLORS = {
                background: "#131200",
                primaryGold: "#FFEA21",
                amber: "#E5AF2E",
                darkGold: "#B49125",
                cyan: "#00FFFF",
                red: "#FF0000",
            };

            const TIMING = {
                bootMs: 400,
                keypressFlashMs: 100,
                verifyMs: 800,
                successFlashMs: 400,
                errorFlashMs: 250,
            };

            const CORRECT_CODE = "0451";
            const MAX_DIGITS = 4;
            const BUTTONS = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "C", "0", "E"];

            const frame = document.getElementById("frame");
            const statusText = document.getElementById("statusText");
            const maskedCode = document.getElementById("maskedCode");
            const keysRoot = document.getElementById("keys");

            let input = "";
            let booted = false;
            let locked = true;
            const keyEls = new Map();

            function setStatus(text, kind = "") {
                statusText.textContent = text;
                statusText.className = `status ${kind}`.trim();
            }

            function refreshMask() {
                maskedCode.textContent = input.replace(/./g, "*");
            }

            function flashKey(label) {
                const el = keyEls.get(label);
                if (!el) return;
                el.classList.remove("flash");
                void el.offsetWidth;
                el.classList.add("flash");
                window.setTimeout(() => el.classList.remove("flash"), TIMING.keypressFlashMs);
            }

            function press(label) {
                if (!booted || locked) return;
                flashKey(label);

                if (/\d/.test(label)) {
                    if (input.length < MAX_DIGITS) {
                        input += label;
                        refreshMask();
                        setStatus("Digit accepted");
                    }
                    return;
                }

                if (label === "C") {
                    input = "";
                    refreshMask();
                    setStatus("Input cleared");
                    return;
                }

                if (label === "E") {
                    verify();
                }
            }

            function verify() {
                if (input.length === 0) {
                    setStatus("No code entered", "error");
                    return;
                }

                locked = true;
                setStatus("Verifying...");

                window.setTimeout(() => {
                    if (input === CORRECT_CODE) {
                        setStatus("Access granted", "ok");
                        frame.animate(
                            [{ boxShadow: "0 0 32px rgba(156, 255, 156, 0.8)" }, { boxShadow: "0 0 32px rgba(255, 234, 33, 0.18)" }],
                            { duration: TIMING.successFlashMs, easing: "ease-out" }
                        );
                    } else {
                        setStatus("Access denied", "error");
                        frame.animate(
                            [{ boxShadow: "0 0 34px rgba(255, 0, 0, 0.85)" }, { boxShadow: "0 0 32px rgba(255, 234, 33, 0.18)" }],
                            { duration: TIMING.errorFlashMs, easing: "ease-out" }
                        );
                        input = "";
                        refreshMask();
                    }
                    locked = false;
                }, TIMING.verifyMs);
            }

            function onKeydown(event) {
                const key = event.key;

                if (/^[0-9]$/.test(key)) {
                    event.preventDefault();
                    press(key);
                    return;
                }

                if (key === "Backspace" || key.toLowerCase() === "c") {
                    event.preventDefault();
                    press("C");
                    return;
                }

                if (key === "Enter" || key.toLowerCase() === "e") {
                    event.preventDefault();
                    press("E");
                }
            }

            function createButtons() {
                BUTTONS.forEach((label) => {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "key";
                    button.textContent = label;
                    button.setAttribute("aria-label", `Key ${label}`);
                    button.addEventListener("click", () => press(label));
                    keysRoot.appendChild(button);
                    keyEls.set(label, button);
                });
            }

            function boot() {
                createButtons();
                refreshMask();
                window.addEventListener("keydown", onKeydown);

                setStatus("Boot sequence... scanline sync");
                window.setTimeout(() => {
                    frame.classList.remove("booting");
                    booted = true;
                    locked = false;
                    setStatus("Awaiting passcode");
                }, TIMING.bootMs);
            }

            boot();
            window.DEUS_EX_COLORS = COLORS;
            window.DEUS_EX_TIMING = TIMING;
        })();
    </script>
</body>
</html>
