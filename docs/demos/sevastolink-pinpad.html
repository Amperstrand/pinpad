<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevastolink Terminal - Alien: Isolation</title>
    <style>
        /* ===========================================
           ROOT STYLES & SEVASTOLINK THEME
           =========================================== */
        :root {
            --xenomorph-skin: #0c290c;
            --terminal-green: #134213;
            --seegson-green: #05b669;
            --acid-blood: #f07826;
            --hypersleep-white: #ccd5d4;
            --synthetic-skin: #7a807f;
            --pure-black: #000000;
            --dark-bg: #0a0a0a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', 'OCR-A', monospace;
            background: var(--dark-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--seegson-green);
            padding: 20px;
        }

        /* ===========================================
           HEADER
           =========================================== */
        .header {
            text-align: center;
            margin-bottom: 15px;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--terminal-green);
        }

        .header .station-name {
            font-size: 14px;
            color: var(--seegson-green);
            margin-bottom: 4px;
            text-shadow: 0 0 10px var(--seegson-green);
        }

        /* ===========================================
           CRT CONTAINER
           =========================================== */
        .crt-container {
            position: relative;
            background: var(--pure-black);
            border: 8px solid #1a1a1a;
            border-radius: 12px;
            box-shadow: 
                0 0 30px rgba(5, 182, 105, 0.2),
                inset 0 0 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* ===========================================
           SCAN LINES OVERLAY
           =========================================== */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 1px,
                rgba(0, 0, 0, 0.35) 1px,
                rgba(0, 0, 0, 0.35) 2px
            );
            pointer-events: none;
            z-index: 10;
        }

        /* ===========================================
           CRT CURVATURE EFFECT
           =========================================== */
        .crt-curvature {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at center,
                transparent 0%,
                transparent 70%,
                rgba(0, 0, 0, 0.4) 100%
            );
            pointer-events: none;
            z-index: 11;
        }

        /* ===========================================
           CANVAS
           =========================================== */
        #sevastolinkCanvas {
            display: block;
            cursor: crosshair;
        }

        /* ===========================================
           STATUS BAR
           =========================================== */
        .status-bar {
            margin-top: 15px;
            padding: 8px 15px;
            background: rgba(12, 41, 12, 0.6);
            border: 1px solid var(--terminal-green);
            border-radius: 2px;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status-text {
            color: var(--seegson-green);
            text-shadow: 0 0 5px var(--seegson-green);
        }

        /* ===========================================
           CONTROLS
           =========================================== */
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .btn {
            background: rgba(19, 66, 19, 0.4);
            border: 1px solid var(--terminal-green);
            color: var(--seegson-green);
            padding: 8px 16px;
            font-family: inherit;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.15s ease;
        }

        .btn:hover {
            background: rgba(5, 182, 105, 0.2);
            border-color: var(--seegson-green);
            box-shadow: 0 0 10px rgba(5, 182, 105, 0.3);
        }

        .btn:active {
            background: var(--terminal-green);
            transform: scale(0.98);
        }

        .btn.active {
            background: var(--seegson-green);
            color: var(--xenomorph-skin);
        }

        /* ===========================================
           INSTRUCTIONS
           =========================================== */
        .instructions {
            margin-top: 15px;
            font-size: 9px;
            color: var(--synthetic-skin);
            text-align: center;
            letter-spacing: 1px;
            max-width: 320px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="station-name">SEEGSON SEVASTOLINK</div>
        <div>Sevastopol Station - Terminal Access</div>
    </div>

    <div class="crt-container">
        <canvas id="sevastolinkCanvas" width="320" height="420"></canvas>
        <div class="scanlines"></div>
        <div class="crt-curvature"></div>
    </div>

    <div class="status-bar">
        <div class="status-text" id="statusText">STATUS: AWAITING INPUT</div>
    </div>

    <div class="controls">
        <button class="btn" id="demoBtn">Demo</button>
        <button class="btn" id="resetBtn">Reset</button>
        <button class="btn" id="clearBtn">Clear Code</button>
    </div>

    <div class="instructions">
        Enter access code using keypad. Press ENTER to submit.
    </div>

    <script>
        // ===========================================
        // SEVASTOLINK TERMINAL PINPAD
        // Alien: Isolation (2014) Style
        // Pure Vanilla JavaScript Implementation
        // ===========================================

        (() => {
            'use strict';

            // ===========================================
            // COLOR DEFINITIONS
            // ===========================================
            const COLORS = {
                XENOMORPH_SKIN: '#0c290c',     // Background dark green
                TERMINAL_GREEN: '#134213',     // Secondary background, dim text
                SEEGSON_GREEN: '#05b669',      // Primary text, highlights
                ACID_BLOOD: '#f07826',         // Warnings, errors, accents
                HYPERSLEEP_WHITE: '#ccd5d4',   // Bright text, selection
                SYNTHETIC_SKIN: '#7a807f',     // Muted text, disabled
                PURE_BLACK: '#000000',         // CRT screen background
            };

            // ===========================================
            // CONFIGURATION CONSTANTS
            // ===========================================
            const CONFIG = {
                // Canvas dimensions
                CANVAS_WIDTH: 320,
                CANVAS_HEIGHT: 420,

                // Button layout
                BUTTONS: [
                    '1', '2', '3',
                    '4', '5', '6',
                    '7', '8', '9',
                    'C', '0', 'E'  // C=Clear, E=Enter
                ],
                BUTTONS_PER_ROW: 3,
                BUTTON_WIDTH: 80,
                BUTTON_HEIGHT: 50,
                BUTTON_GAP: 12,
                MARGIN_X: 25,
                MARGIN_Y: 140,  // Leave space for display area

                // Display
                MAX_CODE_LENGTH: 8,
                MASK_CHAR: '\u2588',  // Full block character

                // Animation timing (milliseconds)
                CURSOR_BLINK: 530,
                KEYPRESS_FLASH: 150,
                VERIFY_DELAY: 800,
                SCREEN_FLICKER_MIN: 2000,
                SCREEN_FLICKER_MAX: 4000,
                SCREEN_FLICKER_DURATION: 100,
                ERROR_FLASH: 250,
                SUCCESS_FLASH: 400,
                AUTH_CODE: '1234',

                // CRT effects
                SCANLINE_INTENSITY: 0.25,
                NOISE_INTENSITY: 0.08,
                FLICKER_CHANCE: 0.005,

                // Animation
                TARGET_FPS: 60
            };

            // ===========================================
            // STATE MANAGEMENT
            // ===========================================
            const state = {
                // Entered code
                code: '',
                
                // Cursor visibility toggle
                cursorVisible: true,
                lastCursorToggle: 0,

                // Button flash state
                flashingButton: null,
                flashStartTime: 0,

                // Screen effects
                screenFlicker: false,
                flickerStartTime: 0,
                nextFlickerTime: 0,

                // Authentication state
                authState: 'idle',  // idle, verifying, success, denied
                authStartTime: 0,

                // Demo mode
                demoMode: false,
                demoInterval: null,

                // Animation
                lastFrameTime: 0,
                animationId: null,

                // Cached film grain (regenerated at ~10fps)
                cachedGrain: null,
                lastGrainUpdate: 0,
                GRAIN_UPDATE_INTERVAL: 100,  // 100ms = 10fps

                // UI references
                canvas: null,
                ctx: null,
                statusText: null
            };

            // ===========================================
            // INITIALIZATION
            // ===========================================
            function init() {
                state.canvas = document.getElementById('sevastolinkCanvas');
                state.ctx = state.canvas.getContext('2d');
                state.statusText = document.getElementById('statusText');

                // Initialize timing
                state.lastCursorToggle = Date.now();
                state.nextFlickerTime = Date.now() + randomRange(
                    CONFIG.SCREEN_FLICKER_MIN,
                    CONFIG.SCREEN_FLICKER_MAX
                );

                setupEventListeners();
                startAnimation();
                updateStatus('AWAITING INPUT');
            }

            // ===========================================
            // EVENT HANDLERS
            // ===========================================
            function setupEventListeners() {
                state.canvas.addEventListener('click', handleCanvasClick);
                document.getElementById('demoBtn').addEventListener('click', toggleDemoMode);
                document.getElementById('resetBtn').addEventListener('click', resetTerminal);
                document.getElementById('clearBtn').addEventListener('click', clearCode);

                // Keyboard support
                document.addEventListener('keydown', handleKeyDown);
            }

            function handleKeyDown(event) {
                const key = event.key.toUpperCase();
                
                if (key >= '0' && key <= '9') {
                    pressButton(key);
                } else if (key === 'C' || key === 'BACKSPACE') {
                    pressButton('C');
                } else if (key === 'ENTER') {
                    pressButton('E');
                }
            }

            function handleCanvasClick(event) {
                const rect = state.canvas.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;

                const buttonLabel = getButtonAtPosition(x, y);
                if (buttonLabel !== null) {
                    pressButton(buttonLabel);
                }
            }

            function getButtonAtPosition(x, y) {
                for (let i = 0; i < CONFIG.BUTTONS.length; i++) {
                    const buttonPos = getButtonPosition(i);
                    
                    if (x >= buttonPos.x && 
                        x <= buttonPos.x + CONFIG.BUTTON_WIDTH &&
                        y >= buttonPos.y && 
                        y <= buttonPos.y + CONFIG.BUTTON_HEIGHT) {
                        return CONFIG.BUTTONS[i];
                    }
                }
                return null;
            }

            function getButtonPosition(index) {
                const row = Math.floor(index / CONFIG.BUTTONS_PER_ROW);
                const col = index % CONFIG.BUTTONS_PER_ROW;

                return {
                    x: CONFIG.MARGIN_X + col * (CONFIG.BUTTON_WIDTH + CONFIG.BUTTON_GAP),
                    y: CONFIG.MARGIN_Y + row * (CONFIG.BUTTON_HEIGHT + CONFIG.BUTTON_GAP)
                };
            }

            function pressButton(label) {
                if (state.authState === 'verifying') return;

                // Record flash
                state.flashingButton = label;
                state.flashStartTime = Date.now();

                // Handle button action
                if (label === 'C') {
                    // Clear last digit
                    state.code = state.code.slice(0, -1);
                    updateStatus('INPUT CLEARED');
                } else if (label === 'E') {
                    // Enter - submit code
                    submitCode();
                } else if (state.code.length < CONFIG.MAX_CODE_LENGTH) {
                    // Add digit
                    state.code += label;
                    updateStatus('INPUT RECEIVED');
                }
            }

            function submitCode() {
                if (state.code.length === 0) {
                    updateStatus('ERROR: NO CODE ENTERED');
                    flashError();
                    return;
                }

                state.authState = 'verifying';
                state.authStartTime = Date.now();
                updateStatus('VERIFYING...');

                // Simulate verification delay
                setTimeout(() => {
                    const success = state.code === CONFIG.AUTH_CODE;
                    
                    if (success) {
                        state.authState = 'success';
                        state.authStartTime = Date.now();
                        updateStatus('ACCESS GRANTED');
                    } else {
                        state.authState = 'denied';
                        state.authStartTime = Date.now();
                        updateStatus('ACCESS DENIED');
                    }

                    // Reset after delay
                    setTimeout(() => {
                        state.authState = 'idle';
                        state.code = '';
                        updateStatus('AWAITING INPUT');
                    }, success ? CONFIG.SUCCESS_FLASH : CONFIG.ERROR_FLASH);
                }, CONFIG.VERIFY_DELAY);
            }

            function flashError() {
                state.authState = 'denied';
                state.authStartTime = Date.now();
                setTimeout(() => {
                    state.authState = 'idle';
                }, CONFIG.ERROR_FLASH);
            }

            function toggleDemoMode() {
                state.demoMode = !state.demoMode;
                const btn = document.getElementById('demoBtn');

                if (state.demoMode) {
                    btn.classList.add('active');
                    btn.textContent = 'Stop';
                    startDemoSequence();
                } else {
                    btn.classList.remove('active');
                    btn.textContent = 'Demo';
                    stopDemoSequence();
                }
            }

            function startDemoSequence() {
                enterRandomCode();
                state.demoInterval = setInterval(() => {
                    if (state.demoMode && state.authState === 'idle') {
                        enterRandomCode();
                    }
                }, 5000);
            }

            function stopDemoSequence() {
                if (state.demoInterval) {
                    clearInterval(state.demoInterval);
                    state.demoInterval = null;
                }
            }

            function enterRandomCode() {
                if (state.authState !== 'idle') return;
                
                const length = Math.floor(Math.random() * 4) + 4; // 4-7 digits
                
                for (let i = 0; i < length; i++) {
                    const digit = Math.floor(Math.random() * 10).toString();
                    
                    setTimeout(() => {
                        if (state.authState === 'idle') {
                            pressButton(digit);
                        }
                    }, i * 200);
                }

                // Submit after entering
                setTimeout(() => {
                    if (state.authState === 'idle') {
                        pressButton('E');
                    }
                }, length * 200 + 300);
            }

            function resetTerminal() {
                state.code = '';
                state.authState = 'idle';
                updateStatus('TERMINAL RESET');
            }

            function clearCode() {
                state.code = '';
                updateStatus('CODE CLEARED');
            }

            function updateStatus(text) {
                state.statusText.textContent = `STATUS: ${text}`;
            }

            // ===========================================
            // UTILITY FUNCTIONS
            // ===========================================
            function randomRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            // ===========================================
            // RENDERING
            // ===========================================
            function startAnimation() {
                function loop(timestamp) {
                    const deltaTime = timestamp - state.lastFrameTime;
                    
                    if (deltaTime >= 1000 / CONFIG.TARGET_FPS) {
                        state.lastFrameTime = timestamp;
                        update();
                        render();
                    }

                    state.animationId = requestAnimationFrame(loop);
                }

                state.animationId = requestAnimationFrame(loop);
            }

            function update() {
                const now = Date.now();

                // Update cursor blink
                if (now - state.lastCursorToggle >= CONFIG.CURSOR_BLINK) {
                    state.cursorVisible = !state.cursorVisible;
                    state.lastCursorToggle = now;
                }

                // Update screen flicker
                if (now >= state.nextFlickerTime) {
                    state.screenFlicker = true;
                    state.flickerStartTime = now;
                    state.nextFlickerTime = now + randomRange(
                        CONFIG.SCREEN_FLICKER_MIN,
                        CONFIG.SCREEN_FLICKER_MAX
                    );
                }

                // Clear flicker after duration
                if (state.screenFlicker && now - state.flickerStartTime > CONFIG.SCREEN_FLICKER_DURATION) {
                    state.screenFlicker = false;
                }

                // Clear button flash
                if (state.flashingButton && now - state.flashStartTime > CONFIG.KEYPRESS_FLASH) {
                    state.flashingButton = null;
                }
            }

            function render() {
                const ctx = state.ctx;
                const canvas = state.canvas;

                // Clear with background
                ctx.fillStyle = COLORS.PURE_BLACK;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw screen noise
                drawNoise(ctx, canvas);

                // Apply screen flicker
                if (state.screenFlicker) {
                    ctx.fillStyle = 'rgba(5, 182, 105, 0.03)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                // Draw phosphor glow effect
                drawPhosphorGlow(ctx, canvas);

                // Draw header
                drawHeader(ctx);

                // Draw display area
                drawDisplay(ctx);

                // Draw keypad
                drawKeypad(ctx);

                // Draw footer
                drawFooter(ctx);
            }

            function drawNoise(ctx, canvas) {
                const now = Date.now();

                // Regenerate grain at ~10fps (every 100ms)
                if (!state.cachedGrain || now - state.lastGrainUpdate >= state.GRAIN_UPDATE_INTERVAL) {
                    state.cachedGrain = ctx.createImageData(canvas.width, canvas.height);
                    const data = state.cachedGrain.data;

                    for (let i = 0; i < data.length; i += 4) {
                        if (Math.random() < CONFIG.NOISE_INTENSITY) {
                            const noise = Math.random() * 20;
                            data[i] = noise;     // R
                            data[i + 1] = noise * 2;  // G (green tint)
                            data[i + 2] = noise;     // B
                            data[i + 3] = 30;        // A
                        }
                    }

                    state.lastGrainUpdate = now;
                }

                ctx.putImageData(state.cachedGrain, 0, 0);
            }

            function drawPhosphorGlow(ctx, canvas) {
                // Central glow
                const gradient = ctx.createRadialGradient(
                    canvas.width / 2, canvas.height / 2, 0,
                    canvas.width / 2, canvas.height / 2, canvas.width
                );
                gradient.addColorStop(0, 'rgba(5, 182, 105, 0.05)');
                gradient.addColorStop(0.5, 'rgba(5, 182, 105, 0.02)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0.3)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            function drawHeader(ctx) {
                ctx.font = '12px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillStyle = COLORS.TERMINAL_GREEN;
                ctx.shadowColor = COLORS.SEEGSON_GREEN;
                ctx.shadowBlur = 5;
                ctx.fillText('SEEGSON SEVASTOLINK', CONFIG.CANVAS_WIDTH / 2, 25);
                ctx.shadowBlur = 0;

                // Separator line
                ctx.strokeStyle = COLORS.TERMINAL_GREEN;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(30, 40);
                ctx.lineTo(CONFIG.CANVAS_WIDTH - 30, 40);
                ctx.stroke();

                // System info
                ctx.font = '10px "Courier New", monospace';
                ctx.fillStyle = COLORS.SYNTHETIC_SKIN;
                ctx.fillText('SEVASTOPOL STATION - 2137', CONFIG.CANVAS_WIDTH / 2, 60);
            }

            function drawDisplay(ctx) {
                const displayY = 80;
                const displayHeight = 45;

                // Display background
                ctx.fillStyle = COLORS.XENOMORPH_SKIN;
                ctx.fillRect(25, displayY, CONFIG.CANVAS_WIDTH - 50, displayHeight);

                // Display border
                ctx.strokeStyle = COLORS.TERMINAL_GREEN;
                ctx.lineWidth = 1;
                ctx.strokeRect(25, displayY, CONFIG.CANVAS_WIDTH - 50, displayHeight);

                // Label
                ctx.font = '10px "Courier New", monospace';
                ctx.textAlign = 'left';
                ctx.fillStyle = COLORS.SEEGSON_GREEN;
                ctx.shadowColor = COLORS.SEEGSON_GREEN;
                ctx.shadowBlur = 4;
                ctx.fillText('ACCESS CODE:', 35, displayY + 15);
                ctx.shadowBlur = 0;

                // Code display with cursor
                ctx.font = '18px "Courier New", monospace';
                ctx.fillStyle = COLORS.HYPERSLEEP_WHITE;
                ctx.shadowColor = COLORS.SEEGSON_GREEN;
                ctx.shadowBlur = 6;
                
                let displayText = state.code.split('').map(() => CONFIG.MASK_CHAR).join('');
                
                // Add cursor
                if (state.cursorVisible && state.authState === 'idle') {
                    displayText += '\u2588';  // Full block cursor
                }

                ctx.fillText(displayText, 35, displayY + 35);
                ctx.shadowBlur = 0;

                // Auth state overlay
                if (state.authState === 'success') {
                    ctx.fillStyle = 'rgba(5, 182, 105, 0.3)';
                    ctx.fillRect(25, displayY, CONFIG.CANVAS_WIDTH - 50, displayHeight);
                } else if (state.authState === 'denied') {
                    ctx.fillStyle = 'rgba(240, 120, 38, 0.3)';
                    ctx.fillRect(25, displayY, CONFIG.CANVAS_WIDTH - 50, displayHeight);
                }
            }

            function drawKeypad(ctx) {
                CONFIG.BUTTONS.forEach((label, index) => {
                    drawButton(ctx, index, label);
                });
            }

            function drawButton(ctx, index, label) {
                const pos = getButtonPosition(index);
                const isFlashing = state.flashingButton === label;
                const now = Date.now();

                // Calculate flash intensity
                let flashIntensity = 0;
                if (isFlashing) {
                    const elapsed = now - state.flashStartTime;
                    flashIntensity = 1 - (elapsed / CONFIG.KEYPRESS_FLASH);
                    flashIntensity = Math.max(0, flashIntensity);
                }

                // Chromatic aberration on hot edges (when flashing intensely)
                const applyChromatic = isFlashing && flashIntensity > 0.4;
                const chromaOffset = 2;  // RGB channel offset in pixels

                if (applyChromatic) {
                    // Draw red channel offset (left)
                    ctx.save();
                    ctx.globalCompositeOperation = 'lighter';
                    ctx.globalAlpha = 0.5 * flashIntensity;
                    ctx.strokeStyle = '#ff0000';
                    ctx.lineWidth = 2;
                    roundRect(ctx, pos.x - chromaOffset, pos.y, CONFIG.BUTTON_WIDTH, CONFIG.BUTTON_HEIGHT, 3);
                    ctx.stroke();
                    ctx.restore();

                    // Draw blue channel offset (right)
                    ctx.save();
                    ctx.globalCompositeOperation = 'lighter';
                    ctx.globalAlpha = 0.5 * flashIntensity;
                    ctx.strokeStyle = '#0000ff';
                    ctx.lineWidth = 2;
                    roundRect(ctx, pos.x + chromaOffset, pos.y, CONFIG.BUTTON_WIDTH, CONFIG.BUTTON_HEIGHT, 3);
                    ctx.stroke();
                    ctx.restore();
                }

                // Button background
                if (flashIntensity > 0) {
                    // Flashed state - bright green
                    const r = Math.round(5 + (204 - 5) * flashIntensity * 0.5);
                    const g = Math.round(182 + (213 - 182) * flashIntensity * 0.5);
                    const b = Math.round(105 + (212 - 105) * flashIntensity * 0.5);
                    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                } else {
                    ctx.fillStyle = COLORS.XENOMORPH_SKIN;
                }

                roundRect(ctx, pos.x, pos.y, CONFIG.BUTTON_WIDTH, CONFIG.BUTTON_HEIGHT, 3);
                ctx.fill();

                // Button border
                ctx.strokeStyle = isFlashing ? COLORS.HYPERSLEEP_WHITE : COLORS.TERMINAL_GREEN;
                ctx.lineWidth = isFlashing ? 2 : 1;
                roundRect(ctx, pos.x, pos.y, CONFIG.BUTTON_WIDTH, CONFIG.BUTTON_HEIGHT, 3);
                ctx.stroke();

                // Button glow when flashing
                if (isFlashing && flashIntensity > 0.5) {
                    ctx.shadowColor = COLORS.SEEGSON_GREEN;
                    ctx.shadowBlur = 15;
                    roundRect(ctx, pos.x, pos.y, CONFIG.BUTTON_WIDTH, CONFIG.BUTTON_HEIGHT, 3);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                // Button label
                ctx.font = '20px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const centerX = pos.x + CONFIG.BUTTON_WIDTH / 2;
                const centerY = pos.y + CONFIG.BUTTON_HEIGHT / 2;

                // Special labels
                let displayLabel = label;
                if (label === 'C') displayLabel = 'CLR';
                else if (label === 'E') displayLabel = 'ENT';

                // Chromatic aberration on label when flashing hard
                if (applyChromatic) {
                    ctx.globalAlpha = 0.6;
                    ctx.fillStyle = '#ff0044';  // Red offset
                    ctx.fillText(displayLabel, centerX - chromaOffset, centerY);
                    ctx.fillStyle = '#0044ff';  // Blue offset
                    ctx.fillText(displayLabel, centerX + chromaOffset, centerY);
                    ctx.globalAlpha = 1;
                }

                ctx.fillStyle = isFlashing ? COLORS.XENOMORPH_SKIN : COLORS.SEEGSON_GREEN;

                if (isFlashing) {
                    ctx.shadowColor = COLORS.HYPERSLEEP_WHITE;
                    ctx.shadowBlur = 5;
                }

                ctx.fillText(displayLabel, centerX, centerY);
                ctx.shadowBlur = 0;
            }

            function drawFooter(ctx) {
                const footerY = CONFIG.CANVAS_HEIGHT - 25;

                // Separator line
                ctx.strokeStyle = COLORS.TERMINAL_GREEN;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(30, footerY - 10);
                ctx.lineTo(CONFIG.CANVAS_WIDTH - 30, footerY - 10);
                ctx.stroke();

                // Status text
                ctx.font = '9px "Courier New", monospace';
                ctx.textAlign = 'center';
                
                if (state.authState === 'verifying') {
                    ctx.fillStyle = COLORS.SEEGSON_GREEN;
                } else if (state.authState === 'success') {
                    ctx.fillStyle = COLORS.SEEGSON_GREEN;
                    ctx.shadowColor = COLORS.SEEGSON_GREEN;
                    ctx.shadowBlur = 10;
                } else if (state.authState === 'denied') {
                    ctx.fillStyle = COLORS.ACID_BLOOD;
                    ctx.shadowColor = COLORS.ACID_BLOOD;
                    ctx.shadowBlur = 10;
                } else {
                    ctx.fillStyle = COLORS.SYNTHETIC_SKIN;
                }

                const statusText = state.authState === 'idle' 
                    ? 'READY' 
                    : state.authState.toUpperCase();
                ctx.fillText(statusText, CONFIG.CANVAS_WIDTH / 2, footerY);
                ctx.shadowBlur = 0;
            }

            function roundRect(ctx, x, y, width, height, radius) {
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + width - radius, y);
                ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                ctx.lineTo(x + width, y + height - radius);
                ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                ctx.lineTo(x + radius, y + height);
                ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
            }

            // ===========================================
            // START APPLICATION
            // ===========================================
            document.addEventListener('DOMContentLoaded', init);

        })();
    </script>
</body>
</html>
